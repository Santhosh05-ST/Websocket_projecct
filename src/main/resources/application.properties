
spring.application.name=videochat



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/videochat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}



spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=my-super-secret-key-for-video-chat-application-2026
jwt.expiration=3600000

server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

server.port=${PORT:8080}

